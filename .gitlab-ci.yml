image: golang:1.25

include:
  - project: shared-scripts/gitlab-ci
    file: /autodevops.yml
    ref: feat/v3
    inputs:
      target: golang
      topic: none
      dev_branch: main
      multi_arch: "enabled"
      prod_deployment: false
      image: golang:1.25
# mockgen setup
Test:
  before_script:
    - export PATH=$GOPATH/bin:$PATH
    - go get go.uber.org/mock/mockgen@latest
    - go install go.uber.org/mock/mockgen@latest
Vet:
  before_script:
    - export PATH=$GOPATH/bin:$PATH
    - go get go.uber.org/mock/mockgen@latest
    - go install go.uber.org/mock/mockgen@latest
Build:
  before_script:
    - export PATH=$GOPATH/bin:$PATH
    - go get go.uber.org/mock/mockgen@latest
    - go install go.uber.org/mock/mockgen@latest
Dependency-Track:
  before_script:
  - export PATH=$GOPATH/bin:$PATH
    - go get go.uber.org/mock/mockgen@latest
    - go install go.uber.org/mock/mockgen@latest

Docker Release:
  variables:
    PROJECT_VERSION: "${CI_COMMIT_REF_NAME}"

Deploy Dev Manual:
  rules:
  - when: never

Deploy Fat:
  rules:
    - when: never
